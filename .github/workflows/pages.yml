name: Mobil Siteyi Yayinla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4
      - name: GitHub Pages'i hazirla
        uses: actions/configure-pages@v5
      - name: Site paketini hazirla
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Yayinla
        id: deployment
        uses: actions/deploy-pages@v4
